<style>

  :root{
    --bg:#F6F2ED;
    --surface:#FFFFFF;
    --surface-2:#F1E8E2;
    --ink:#231C19;
    --muted:#7A6F67;
    --line:#E6DBD2;
    --accent:#8C2E3B;
    --accent-ink:#FDEEEF;
    --accent-soft:#F4E1E0;
    --lfl:#3F6B4E;
    --lfl-soft:#E6EEE7;
    --cl:#867A70;
    --cl-soft:#EEE8E2;
    --op:#B0721C;
    --op-soft:#F4E8D4;
    --shadow: 0 1px 2px rgba(35,28,25,0.06), 0 6px 20px -8px rgba(35,28,25,0.18);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1613;
      --surface:#231D19;
      --surface-2:#2B221E;
      --ink:#F3EBE5;
      --muted:#AB9C92;
      --line:#3A2F29;
      --accent:#E28D93;
      --accent-ink:#2A1417;
      --accent-soft:#3A2226;
      --lfl:#8FBB9C;
      --lfl-soft:#243027;
      --cl:#B3A79C;
      --cl-soft:#2C2622;
      --op:#E3B15E;
      --op-soft:#372B18;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 26px -10px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1613;
    --surface:#231D19;
    --surface-2:#2B221E;
    --ink:#F3EBE5;
    --muted:#AB9C92;
    --line:#3A2F29;
    --accent:#E28D93;
    --accent-ink:#2A1417;
    --accent-soft:#3A2226;
    --lfl:#8FBB9C;
    --lfl-soft:#243027;
    --cl:#B3A79C;
    --cl-soft:#2C2622;
    --op:#E3B15E;
    --op-soft:#372B18;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 10px 26px -10px rgba(0,0,0,0.55);

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, sans-serif;
    padding: clamp(20px,4vw,48px) 20px 64px;
  }
  .wrap{ max-width:1080px; margin:0 auto; display:flex; flex-direction:column; gap:28px; }

  .eyebrow{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
  }
  h1{
    font-family:"Fraunces", Georgia, serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:clamp(32px,5vw,44px);
    line-height:1.05;
    margin:6px 0 0;
    text-wrap:balance;
  }
  .lede{
    max-width:60ch;
    color:var(--muted);
    font-size:15px;
    line-height:1.55;
    margin:10px 0 0;
  }

  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .stat{
    background:var(--surface);
    padding:18px 20px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .stat .n{
    font-family:"Fraunces", Georgia, serif;
    font-weight:600;
    font-size:30px;
    font-variant-numeric:tabular-nums;
  }
  .stat .l{ font-size:12.5px; color:var(--muted); }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .search{
    flex:1 1 220px;
    position:relative;
  }
  .search input{
    width:100%;
    font:inherit;
    font-size:14px;
    padding:10px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
  }
  .search input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .search input::placeholder{ color:var(--muted); }

  .chiprow{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{
    font:inherit;
    font-size:12.5px;
    font-weight:500;
    padding:7px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--muted);
    cursor:pointer;
  }
  .chip[aria-pressed="true"]{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
  }
  .chip:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .count-line{ font-size:12.5px; color:var(--muted); }
  .count-line b{ color:var(--ink); font-variant-numeric:tabular-nums; }

  .group{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .group + .group{ margin-top:14px; }
  .group-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:12px 18px;
    background:var(--surface-2);
    border-bottom:1px solid var(--line);
  }
  .group-head .brand{
    font-family:"Fraunces", Georgia, serif;
    font-weight:600;
    font-size:16px;
  }
  .group-head .n{
    font-size:12px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  .tablewrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; min-width:560px; }
  thead th{
    text-align:left;
    font-size:11.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:500;
    padding:8px 18px;
    border-bottom:1px solid var(--line);
  }
  tbody td{
    padding:10px 18px;
    border-bottom:1px solid var(--line);
    font-size:14px;
    vertical-align:middle;
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface-2); }
  td.salon{ font-weight:500; }
  td.code{
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:12.5px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  .pill{
    display:inline-block;
    font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:11px;
    font-weight:500;
    padding:3px 8px;
    border-radius:6px;
    white-space:nowrap;
  }
  .pill.lfl{ background:var(--lfl-soft); color:var(--lfl); }
  .pill.cl{ background:var(--cl-soft); color:var(--cl); }
  .pill.op{ background:var(--op-soft); color:var(--op); }

  .empty{
    padding:40px 18px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }

  footer{
    font-size:12px;
    color:var(--muted);
    border-top:1px solid var(--line);
    padding-top:16px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
</style>

<div class="wrap">

    <div class="eyebrow">Grupo Provalliance · KPI D+3</div>

  </footer>

</div>

const state = { q:"", brand:"ALL", type:"ALL" };

function typeClass(t){
  if(t.startsWith("LFL")) return "lfl";
  if(t.startsWith("CL")) return "cl";
  if(t.startsWith("OP")) return "op";
  return "cl";
}

function uniqueSorted(arr){ return [...new Set(arr)].sort(); }

function renderStats(){
  const brands = uniqueSorted(DATA.map(d=>d.Brand));
  const lfl = DATA.filter(d=>d.Type.startsWith("LFL")).length;
  const cl = DATA.filter(d=>d.Type.startsWith("CL")).length;
  const op = DATA.filter(d=>d.Type.startsWith("OP")).length;
  const stats = [
    {n: DATA.length, l:"Salones totales"},
    {n: brands.length, l:"Enseñas"},
    {n: lfl, l:"Tipo LFL"},
    {n: cl, l:"Tipo CL"},
    {n: op, l:"Tipo OP"},
  ];
  document.getElementById("stats").innerHTML = stats.map(s=>
    `<div class="stat"><div class="n">${s.n}</div><div class="l">${s.l}</div></div>`
  ).join("");
}

function renderChips(){
  const brands = uniqueSorted(DATA.map(d=>d.Brand));
  const types = uniqueSorted(DATA.map(d=>d.Type));

  const brandHtml = [`<button class="chip" data-kind="brand" data-val="ALL" aria-pressed="true">Todas las enseñas</button>`]
    .concat(brands.map(b=>`<button class="chip" data-kind="brand" data-val="${b}" aria-pressed="false">${b} · ${DATA.filter(d=>d.Brand===b).length}</button>`));
  document.getElementById("brandChips").innerHTML = brandHtml.join("");

  const typeHtml = [`<button class="chip" data-kind="type" data-val="ALL" aria-pressed="true">Todos los tipos</button>`]
    .concat(types.map(t=>`<button class="chip" data-kind="type" data-val="${t}" aria-pressed="false">${t}</button>`));
  document.getElementById("typeChips").innerHTML = typeHtml.join("");

  document.querySelectorAll(".chip").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const kind = btn.dataset.kind;
      state[kind] = btn.dataset.val;
      document.querySelectorAll(`.chip[data-kind="${kind}"]`).forEach(b=>
        b.setAttribute("aria-pressed", b===btn ? "true" : "false"));
      renderResults();
    });
  });
}

    if(state.brand!=="ALL" && d.Brand!==state.brand) return false;
    if(state.type!=="ALL" && d.Type!==state.type) return false;
    if(q && !(d.Salon.toLowerCase().includes(q) || d.Brand.toLowerCase().includes(q) || d.ProjectNumber1.includes(q) || d.ProjectNumber2.toLowerCase().includes(q))) return false;
    return true;
  });
}

function renderResults(){
  const rows = filtered();
  document.getElementById("countLine").innerHTML = `Mostrando <b>${rows.length}</b> de <b>${DATA.length}</b> salones`;

  const el = document.getElementById("results");
  if(rows.length===0){
    el.innerHTML = `<div class="group"><div class="empty">Ningún salón coincide con la búsqueda o los filtros.</div></div>`;
    return;
  }

  const byBrand = new Map();
  rows.sort((a,b)=> a.Brand.localeCompare(b.Brand) || a.Salon.localeCompare(b.Salon));
  rows.forEach(r=>{
    if(!byBrand.has(r.Brand)) byBrand.set(r.Brand, []);
    byBrand.get(r.Brand).push(r);
  });

  el.innerHTML = [...byBrand.entries()].map(([brand, items])=>`
    <div class="group">
      <div class="group-head">
        <span class="brand">${brand}</span>
        <span class="n">${items.length} salón${items.length===1?"":"es"}</span>
      </div>
      <div class="tablewrap">
        <table>
          <thead>
            <tr><th>Salón</th><th>Tipo</th><th>Nº proyecto</th><th>Código</th></tr>
          </thead>
          <tbody>
            ${items.map(i=>`
              <tr>
                <td class="salon">${i.Salon}</td>
                <td><span class="pill ${typeClass(i.Type)}">${i.Type}</span></td>
                <td class="code">${i.ProjectNumber1 || "—"}</td>
                <td class="code">${i.ProjectNumber2 || "—"}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `).join("");
}

document.getElementById("search").addEventListener("input", e=>{
  state.q = e.target.value;
  renderResults();
});

renderStats();
renderChips();
renderResults();
</script>
